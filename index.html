<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Weather Dashboard</h1>

        <p class="subtitle">
            Check live weather information for any city
        </p>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>

        </div>


        <!-- ERROR MESSAGE -->

        <p id="error"></p>


        <!-- WEATHER CARD -->

        <div class="weather-card" id="weatherCard">

            <h2 id="city">City</h2>

            <img
                id="weatherIcon"
                src=""
                alt="Weather icon"
            >

            <h3 id="temperature">--°C</h3>

            <p id="description">Weather</p>


            <div class="weather-info">

                <div>
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>


                <div>
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="wind">-- km/h</strong>
                </div>


                <div>
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

            </div>

        </div>


        <footer>
            Weather Dashboard
        </footer>

    </div>
    <script src="script.js"></script>

</body>

</html>
